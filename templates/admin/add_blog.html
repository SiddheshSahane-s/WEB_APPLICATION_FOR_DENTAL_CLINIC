{% extends "admin/base.html" %}
{% block content %}
<div style="margin-bottom:20px;">
    <a href="{{ url_for('admin.blog') }}" class="btn-outline-sm" style="margin-bottom:15px;"><i class="fas fa-arrow-left"></i> Back</a>
    <h2>Write New Blog Post</h2>
</div>
<div class="card" style="max-width:800px;">
    <form method="POST" action="{{ url_for('admin.add_blog') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group"><label class="form-label">Title</label><input type="text" name="title" class="form-control" required placeholder="e.g. 5 Tips for Healthy Teeth"></div>
        <div class="form-group"><label class="form-label">Category</label><input type="text" name="category" class="form-control" placeholder="e.g. Oral Hygiene, Treatments"></div>
        <div class="form-group"><label class="form-label">Tags</label><input type="text" name="tags" class="form-control" placeholder="comma, separated, tags"></div>
        <div class="form-group"><label class="form-label">Excerpt (Short Summary)</label><textarea name="excerpt" class="form-control" rows="2" required placeholder="A brief summary shown on the blog listing page..."></textarea></div>
        <div class="form-group"><label class="form-label">Full Content</label><textarea name="content" class="form-control" rows="12" required placeholder="Write the full blog post here..."></textarea></div>
        <div class="form-group" style="display:flex;align-items:center;gap:10px;">
            <input type="checkbox" name="publish" id="publish">
            <label for="publish">Publish immediately (uncheck to save as Draft)</label>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Post</button>
    </form>
</div>
{% endblock %}
