{% extends "admin/base.html" %}
{% block content %}
<div style="margin-bottom: 20px;">
    <a href="{{ url_for('admin.specialities') }}" class="btn-outline-sm" style="margin-bottom: 15px;"><i class="fas fa-arrow-left"></i> Back</a>
    <h2>Edit Speciality: {{ spec.name }}</h2>
</div>

<div class="card" style="max-width: 800px;">
    <form method="POST" action="{{ url_for('admin.edit_speciality', id=spec.id) }}" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="form-group">
            <label class="form-label">Speciality Name</label>
            <input type="text" name="name" class="form-control" required value="{{ spec.name }}">
        </div>
        
        <div class="form-group">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" required>{{ spec.description }}</textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">FontAwesome Icon Class</label>
            <input type="text" name="icon" class="form-control" value="{{ spec.icon }}">
        </div>
        
        <div class="form-group">
            <label class="form-label">Upload New Image (Optional)</label>
            {% if spec.image %}
            <div style="margin-bottom: 10px;">
                <img src="{{ url_for('static', filename=spec.image) }}" alt="Current Image" style="height: 60px; border-radius: 8px;">
            </div>
            {% endif %}
            <input type="file" name="image" class="form-control" accept="image/*">
            <small class="text-muted">Leave empty to keep the current image.</small>
        </div>
        
        <div class="form-group">
            <label class="form-label">Common Symptoms</label>
            <textarea name="symptoms" class="form-control" rows="2">{{ spec.symptoms }}</textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">Treatment Methods</label>
            <textarea name="treatment_methods" class="form-control" rows="2">{{ spec.treatment_methods }}</textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">Frequently Asked Questions (FAQ)</label>
            <textarea name="faq" class="form-control" rows="2">{{ spec.faq }}</textarea>
        </div>
        
        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" name="is_active" id="is_active" {% if spec.is_active %}checked{% endif %}>
            <label for="is_active">Active (Visible on website)</label>
        </div>
        
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Speciality</button>
    </form>
</div>
{% endblock %}
