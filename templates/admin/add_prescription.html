{% extends "admin/base.html" %}
{% block content %}
<div style="margin-bottom:20px;">
    <a href="{{ url_for('admin.prescriptions') }}" class="btn-outline-sm" style="margin-bottom:15px;"><i class="fas fa-arrow-left"></i> Back</a>
    <h2>Write New Prescription</h2>
</div>
<div class="card" style="max-width:700px;">
    <form method="POST" action="{{ url_for('admin.add_prescription') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label class="form-label">Patient</label>
            <select name="patient_id" class="form-control" required>
                <option value="">Select Patient</option>
                {% for p in patients %}
                <option value="{{ p.id }}">{{ p.user.name }} — {{ p.patient_code }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Diagnosis</label>
            <textarea name="diagnosis" class="form-control" rows="3" required placeholder="Describe the diagnosis..."></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Medications</label>
            <textarea name="medications" class="form-control" rows="4" placeholder="e.g. Amoxicillin 500mg - 1 tablet 3x/day for 5 days&#10;Ibuprofen 400mg - after meals"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Instructions / Advice</label>
            <textarea name="instructions" class="form-control" rows="2" placeholder="e.g. Avoid hard foods, rinse with warm salt water..."></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Follow-Up Date (Optional)</label>
            <input type="date" name="follow_up_date" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-file-medical"></i> Save Prescription</button>
    </form>
</div>
{% endblock %}
