{% extends "admin/base.html" %}
{% block content %}
<div style="margin-bottom:20px;">
    <a href="{{ url_for('admin.patients') }}" class="btn-outline-sm" style="margin-bottom:15px;"><i class="fas fa-arrow-left"></i> Back</a>
    <h2>Add New Patient</h2>
</div>
<div class="card" style="max-width:700px;">
    <form method="POST" action="{{ url_for('admin.add_patient') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
            <div class="form-group"><label class="form-label">Full Name</label><input type="text" name="name" class="form-control" required></div>
            <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
            <div class="form-group"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control"></div>
            <div class="form-group"><label class="form-label">Age</label><input type="number" name="age" class="form-control"></div>
            <div class="form-group"><label class="form-label">Gender</label>
                <select name="gender" class="form-control"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select>
            </div>
            <div class="form-group"><label class="form-label">Blood Group</label>
                <select name="blood_group" class="form-control"><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
            </div>
        </div>
        <div class="form-group"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2"></textarea></div>
        <div class="form-group"><label class="form-label">Known Allergies</label><input type="text" name="allergies" class="form-control" placeholder="e.g. Penicillin"></div>
        <div class="form-group"><label class="form-label">Medical History</label><textarea name="medical_history" class="form-control" rows="2"></textarea></div>
        <div class="form-group"><label class="form-label">Dental History</label><textarea name="dental_history" class="form-control" rows="2"></textarea></div>
        <small class="text-muted" style="display:block;margin-bottom:15px;">Default password will be the last 4 digits of the phone number.</small>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Register Patient</button>
    </form>
</div>
{% endblock %}
