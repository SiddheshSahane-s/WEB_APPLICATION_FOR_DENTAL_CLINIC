{% extends "base.html" %}
{% block title %}{{ post.title }} - MediDent Blog{% endblock %}
{% block content %}
<section class="section" style="padding-top: 120px;">
    <div class="container" style="max-width: 800px;">
        <div style="margin-bottom: 40px; text-align: center;">
            <span class="badge badge-completed" style="margin-bottom: 15px; display: inline-block;">{{ post.category }}</span>
            <h1 style="font-size: 3rem; margin-bottom: 20px;">{{ post.title }}</h1>
            <div style="display: flex; justify-content: center; gap: 20px; color: var(--text-muted); font-size: 0.9rem;">
                <span><i class="fas fa-calendar"></i> {{ post.published_at.strftime('%d %b %Y') if post.published_at else '' }}</span>
                <span><i class="fas fa-eye"></i> {{ post.views }} Views</span>
            </div>
        </div>
        
        <div style="height: 400px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 6rem; border-radius: var(--radius-lg); margin-bottom: 40px;">
            <i class="fas fa-tooth"></i>
        </div>
        
        <div style="font-size: 1.1rem; line-height: 1.8; color: var(--text-main);">
            {{ post.content | safe }}
        </div>
        
        <hr style="border-color: var(--border-color); margin: 40px 0;">
        <div style="text-align: center;">
            <a href="{{ url_for('public.blog') }}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to Blog</a>
        </div>
    </div>
</section>
{% endblock %}
