{% extends "base.html" %}
{% block title %}Login - MediDent{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><i class="fas fa-tooth"></i></div>
            <h2>Welcome Back</h2>
            <p>Login to your account</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required placeholder="Enter your password">
            </div>
            <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="{{ url_for('auth.forgot_password') }}">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 20px;">Login</button>
        </form>
        <p class="text-center" style="font-size: 0.9rem;">Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
    </div>
</div>
{% endblock %}
