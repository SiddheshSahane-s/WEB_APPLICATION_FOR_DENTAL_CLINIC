{% extends "admin/base.html" %}
{% block content %}
<div style="margin-bottom:20px;">
    <a href="{{ url_for('admin.blog') }}" class="btn-outline-sm" style="margin-bottom:15px;"><i class="fas fa-arrow-left"></i> Back</a>
    <h2>Edit: {{ post.title }}</h2>
</div>
<div class="card" style="max-width:800px;">
    <form method="POST" action="{{ url_for('admin.edit_blog', post_id=post.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group"><label class="form-label">Title</label><input type="text" name="title" class="form-control" required value="{{ post.title }}"></div>
        <div class="form-group"><label class="form-label">Category</label><input type="text" name="category" class="form-control" value="{{ post.category }}"></div>
        <div class="form-group"><label class="form-label">Tags</label><input type="text" name="tags" class="form-control" value="{{ post.tags }}"></div>
        <div class="form-group"><label class="form-label">Excerpt</label><textarea name="excerpt" class="form-control" rows="2" required>{{ post.excerpt }}</textarea></div>
        <div class="form-group"><label class="form-label">Full Content</label><textarea name="content" class="form-control" rows="12" required>{{ post.content }}</textarea></div>
        <div class="form-group" style="display:flex;align-items:center;gap:10px;">
            <input type="checkbox" name="publish" id="publish" {% if post.is_published %}checked{% endif %}>
            <label for="publish">Published</label>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Post</button>
    </form>
</div>
{% endblock %}
