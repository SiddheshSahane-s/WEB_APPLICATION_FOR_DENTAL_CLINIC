{% extends "base.html" %}
{% block title %}My Profile - MediDent{% endblock %}
{% block content %}
<section class="section" style="padding-top:120px;">
    <div class="container" style="max-width:700px;">
        <h2 class="section-title" style="margin-bottom:30px;">My <span class="gradient-text">Profile</span></h2>
        <div class="card">
            <form method="POST" action="{{ url_for('patient.profile') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div style="display:flex;align-items:center;gap:20px;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid var(--border-color);">
                    <div style="width:80px;height:80px;border-radius:50%;background:var(--primary-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;flex-shrink:0;">
                        {{ current_user.name[0] }}
                    </div>
                    <div>
                        <h3 style="margin:0;">{{ current_user.name }}</h3>
                        <p class="text-muted" style="margin:4px 0;">{{ current_user.email }}</p>
                        {% if patient %}<code>{{ patient.patient_code }}</code>{% endif %}
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
                    <div class="form-group"><label class="form-label">Full Name</label><input type="text" name="name" class="form-control" value="{{ current_user.name }}"></div>
                    <div class="form-group"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control" value="{{ current_user.phone }}"></div>
                    {% if patient %}
                    <div class="form-group"><label class="form-label">Blood Group</label>
                        <select name="blood_group" class="form-control">
                            {% for bg in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}
                            <option {% if patient.blood_group==bg %}selected{% endif %}>{{ bg }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group"><label class="form-label">City</label><input type="text" name="city" class="form-control" value="{{ patient.city }}"></div>
                    <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2">{{ patient.address }}</textarea></div>
                    <div class="form-group"><label class="form-label">Known Allergies</label><input type="text" name="allergies" class="form-control" value="{{ patient.allergies }}"></div>
                    {% endif %}
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top:15px;"><i class="fas fa-save"></i> Save Changes</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
