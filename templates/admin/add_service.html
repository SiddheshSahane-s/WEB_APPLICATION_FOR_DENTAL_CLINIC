{% extends "admin/base.html" %}
{% block content %}
<div style="margin-bottom: 20px;">
    <a href="{{ url_for('admin.services') }}" class="btn-outline-sm" style="margin-bottom: 15px;"><i class="fas fa-arrow-left"></i> Back</a>
    <h2>Add New Service</h2>
</div>

<div class="card" style="max-width: 600px;">
    <form method="POST" action="{{ url_for('admin.add_service') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="form-group">
            <label class="form-label">Service Name</label>
            <input type="text" name="name" class="form-control" required placeholder="e.g. Tooth Extraction">
        </div>
        
        <div class="form-group">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-control" placeholder="e.g. Surgery">
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label class="form-label">Base Price (₹)</label>
                <input type="number" step="0.01" name="price" class="form-control" required value="0">
            </div>
            <div class="form-group">
                <label class="form-label">Duration (Minutes)</label>
                <input type="number" name="duration" class="form-control" required value="30">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">FontAwesome Icon Class</label>
            <input type="text" name="icon" class="form-control" placeholder="e.g. fa-stethoscope">
        </div>
        
        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" name="is_active" id="is_active" checked>
            <label for="is_active">Active (Available for booking)</label>
        </div>
        
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Service</button>
    </form>
</div>
{% endblock %}
